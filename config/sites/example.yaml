# Template for a new site. Copy to config/sites/<name>.yaml and adjust.
# Every check block that exists is enabled unless it says `enabled: false`.
# Options of every check are documented at the top of monitor/checks/<check>.py.

name: Example Website
base_url: "${EXAMPLE_BASE_URL:-https://example.com}"
timeout_seconds: 20
request_delay_ms: 300            # be gentle: many hosts ban IPs that send bursts
user_agent: "WebsiteMonitor/2.0 (+https://example.com/contact)"
paths:
  - /

# Requests the browser must never make (form mailers, payment, analytics …).
safety:
  block_urls: []                 # e.g. ["**/api/contact*"]

suites:
  quick: [uptime, ssl]

checks:
  uptime:
    expected_status: 200
    max_response_time_ms: 3000
  ssl:
    warn_days_before_expiry: 21
  redirects:
    enforce_https: true
    # canonical_host: example.com
    # aliases: [www.example.com]
  links:
    max_pages: 10
    max_links: 100
  assets: {}
  headers: {}
  seo: {}
  content:
    required:
      /: ["Example Domain"]
  accessibility: {}
  exposure: {}
  performance:
    enabled: false
  browser: {}

