[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "website-monitor"
version = "2.0.0"
description = "Configuration-driven website monitoring: uptime, TLS, links, SEO, security headers, browser smoke tests and mail-free form tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2", "axe-playwright-python>=0.1.4"]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
website-monitor = "monitor.cli:main"

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright + Chromium"]

[tool.ruff.lint.per-file-ignores]
"monitor/checks/__init__.py" = ["E501"]
"monitor/reporting/html.py" = ["E501"]
